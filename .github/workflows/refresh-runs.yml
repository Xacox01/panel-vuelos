name: refresh-runs (proxy de runs para el panel)

# El panel consume runs.json en vez de la API anónima de GitHub (60 req/h
# compartidas entre todos los visitantes: la tabla "Workflows" salía
# "No disponible"). Este workflow consulta las Actions de AMBOS repos con
# GITHUB_TOKEN (5.000 req/h) y publica runs.json aquí; el panel lo lee como
# archivo estático — sin límites y sin exponer ningún token.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-runs
  cancel-in-progress: true

jobs:
  runs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Consultar runs de ambos repos y escribir runs.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          REPOS = {"qwen": "Xacox01/qwen_vuelos_rio",
                   "rio":  "Xacox01/vuelos-rio-live"}
          out = {"ts": time.strftime("%Y-%m-%d %H:%M:%S", time.gmtime()),
                 "nota": "proxy autenticado del panel; campos = API workflow_runs",
                 "sites": {}}
          for k, repo in REPOS.items():
              j = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/actions/runs?per_page=15"]).decode()
              runs = json.loads(j).get("workflow_runs", [])
              out["sites"][k] = [{"id": r["id"], "name": r["name"],
                                  "run_number": r["run_number"], "event": r["event"],
                                  "status": r["status"], "conclusion": r["conclusion"],
                                  "created_at": r["created_at"], "head_sha": r["head_sha"],
                                  "html_url": r["html_url"]} for r in runs]
          with open("runs.json", "w") as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          print("runs.json:", {k: len(v) for k, v in out["sites"].items()})
          PY

      - name: Publicar runs.json (commit si cambió)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs.json
          if git diff --cached --quiet; then
            echo "runs.json sin cambios"
          else
            git commit -m "runs $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
